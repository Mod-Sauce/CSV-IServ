name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.1.0)'
        required: true
        default: '2.1.0'

env:
  QT_VERSION: '6.8.1'
  APP_VERSION: ${{ github.event.inputs.version || '2.1.0' }}

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ../Qt
        key: ${{ runner.os }}-QtCache-${{ env.QT_VERSION }}-msvc2022
        
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cached: ${{ steps.cache-qt.outputs.cache-hit }}
        
    - name: Setup Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Create build directory
      run: mkdir build
      
    - name: Configure with qmake
      working-directory: build
      run: |
        qmake.exe ..\csv_converter.pro CONFIG+=release
        
    - name: Build application
      working-directory: build
      run: |
        nmake
        
    - name: Create deployment directory
      run: |
        mkdir deployment
        copy build\release\csv_converter.exe deployment\
        
    - name: Deploy Qt libraries
      run: |
        windeployqt.exe --release --no-translations --no-system-d3d-compiler deployment\csv_converter.exe
        
    - name: Copy additional files
      run: |
        if exist README.md copy README.md deployment\
        if exist LICENSE copy LICENSE deployment\
        if exist csv.ico copy csv.ico deployment\
        
    - name: Create installer script
      shell: powershell
      run: |
        @'
        [Setup]
        AppName=CSV-IServ-Converter
        AppVersion=${{ env.APP_VERSION }}
        AppId={{01da2c27-2bf3-41e9-8a7e-a16c3a9205ba}}
        DefaultDirName={autopf}\CSV-IServ-Converter
        DefaultGroupName=CSV-IServ-Converter
        OutputDir=.
        OutputBaseFilename=CSV-IServ-Converter-v${{ env.APP_VERSION }}-Setup
        Compression=lzma
        SolidCompression=yes
        WizardStyle=modern
        ArchitecturesAllowed=x64
        ArchitecturesInstallIn64BitMode=x64
        MinVersion=10.0.17763
        
        [Languages]
        Name: "german"; MessagesFile: "compiler:Languages\German.isl"
        Name: "english"; MessagesFile: "compiler:Default.isl"
        
        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
        
        [Files]
        Source: "deployment\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
        
        [Icons]
        Name: "{group}\CSV-IServ-Converter"; Filename: "{app}\csv_converter.exe"
        Name: "{commondesktop}\CSV-IServ-Converter"; Filename: "{app}\csv_converter.exe"; Tasks: desktopicon
        
        [Run]
        Filename: "{app}\csv_converter.exe"; Description: "{cm:LaunchProgram,CSV-IServ-Converter}"; Flags: nowait postinstall skipifsilent
        '@ | Out-File -FilePath "installer.iss" -Encoding UTF8
        
    - name: Setup Inno Setup
      run: |
        choco install innosetup --yes
        
    - name: Build installer
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
        
    - name: Create portable zip
      run: |
        Compress-Archive -Path deployment\* -DestinationPath CSV-IServ-Converter-v${{ env.APP_VERSION }}-Portable.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CSV-IServ-Converter-v${{ env.APP_VERSION }}-Windows
        path: |
          CSV-IServ-Converter-v${{ env.APP_VERSION }}-Setup.exe
          CSV-IServ-Converter-v${{ env.APP_VERSION }}-Portable.zip
        retention-days: 30
